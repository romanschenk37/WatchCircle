name: 'Publish WatchCircle'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching Directory.Build.props (for example v1.0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: watchcircle-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+\.\d+$') { throw 'Expected a tag such as v1.0.2.0.' }

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test group management
        run: dotnet test tests/WatchCircle.Tests/WatchCircle.Tests.csproj --configuration Release

      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.WatchCircle/Jellyfin.Plugin.WatchCircle.csproj --configuration Release --output bin

      - name: Package plugin and catalog entry
        shell: pwsh
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY

      - name: Create draft release and upload package
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --title "WatchCircle $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          $packages = @(Get-ChildItem artifacts/release -Filter '*.zip')
          if ($packages.Count -ne 1) { throw 'Expected exactly one release package.' }
          $package = $packages[0]
          gh release upload $env:RELEASE_TAG $package.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed. Existing release assets are never overwritten; publish a new version if needed.' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
          Copy-Item -LiteralPath artifacts/release/manifest.json -Destination "$env:RUNNER_TEMP/watchcircle-release.json"

      - name: Update catalog on default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin $env:DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch catalog branch.' }
          git checkout -B $env:DEFAULT_BRANCH "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out catalog branch.' }
          ./scripts/update-catalog.ps1 -ReleaseManifest "$env:RUNNER_TEMP/watchcircle-release.json"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore: publish $env:RELEASE_TAG in plugin catalog"
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit catalog.' }
            git push origin "HEAD:$env:DEFAULT_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw 'Release uploaded, but catalog push failed.' }
          }
